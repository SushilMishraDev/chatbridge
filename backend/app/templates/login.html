{% extends "base.html" %}

{% block content %}
<section class="auth-card">
  <p class="eyebrow">EMAIL SIGN-IN</p>
  <h1>Keep your conversation moving.</h1>
  <p>Enter your email and we will send a one-time verification code.</p>
  <form action="/ui/request-otp" method="post" class="stack">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" value="{{ email }}" autocomplete="email" required>
    <button class="button" type="submit">Send verification code</button>
  </form>
  {% if show_code %}
  <hr>
  <form action="/ui/verify-otp" method="post" class="stack">
    <input type="hidden" name="email" value="{{ email }}">
    <label for="code">Six-digit code</label>
    <input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="one-time-code" required>
    <button class="button" type="submit">Verify and sign in</button>
  </form>
  {% endif %}
  <p class="muted">If email delivery is not configured, check the server log for the local development code.</p>
</section>
{% endblock %}
