<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 330px;
        margin: 0;
        padding: 14px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #fdfcf9;
        color: #1c1915;
      }
      h3 { margin: 0 0 4px; font-family: Georgia, serif; font-size: 18px; }
      .subtitle { font-size: 11px; color: #777; margin: 0 0 12px; }
      input, select, button { width: 100%; margin: 5px 0; padding: 8px 10px; box-sizing: border-box; border-radius: 6px; }
      input { border: 1px solid #d5cebf; font-size: 13px; background: #fff; }
      button { background: #c45c26; color: #fff; border: 0; cursor: pointer; font-weight: 600; font-size: 13px; }
      button.action-btn { background: #166534; font-size: 12px; padding: 9px; display: flex; align-items: center; justify-content: center; gap: 6px; }
      button.action-btn:hover { background: #14532d; }
      button.ghost { background: transparent; color: #666; border: 1px solid #d5cebf; margin-top: 10px; font-weight: normal; }
      button.ghost:hover { background: #f0ece1; }
      li { cursor: pointer; margin: 6px 0; font-size: 12px; padding: 8px; border: 1px solid #e8e2d5; border-radius: 6px; background: #fff; list-style: none; transition: background 0.15s; }
      li:hover { background: #f6f2e9; border-color: #c45c26; }
      ul { padding: 0; margin: 8px 0; max-height: 180px; overflow-y: auto; }
      #msg { min-height: 1.2em; font-size: 12px; color: #166534; margin: 6px 0; word-break: break-word; font-weight: 500; }
      .error { color: #b42318; font-size: 12px; margin: 4px 0; }
      .meta { font-size: 11px; color: #777; margin: 4px 0; }
      .user-pill { background: rgba(0,0,0,0.05); padding: 4px 8px; border-radius: 12px; font-size: 11px; display: inline-block; margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <h3>ChatBridge</h3>
    <div class="subtitle">Continue your AI conversations anywhere</div>

    <div id="login">
      <input id="email" type="email" placeholder="Email address" />
      <input id="password" type="password" placeholder="Password" />
      <button id="loginBtn">Sign In</button>
      <div id="loginErr" class="error"></div>
      <p class="meta">Every real email works. New accounts are automatically created upon sign-in.</p>
    </div>

    <div id="main" hidden>
      <div class="user-pill" id="userEmail">Logged in</div>

      <!-- Quick Scan Active Chat Button -->
      <button id="scanBtn" class="action-btn">
        <span>📥</span> Scan / Sync Current Chat
      </button>

      <div id="msg"></div>

      <div style="margin-top: 10px;">
        <b style="font-size: 12px;">Saved conversations:</b>
        <ul id="chats"></ul>
      </div>

      <label class="meta" for="target">Handoff destination:</label>
      <select id="target">
        <option value="claude">Claude</option>
        <option value="chatgpt">ChatGPT</option>
        <option value="gemini">Gemini</option>
      </select>

      <button id="logoutBtn" class="ghost">Sign out</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
